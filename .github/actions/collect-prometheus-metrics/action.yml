name: "Collect Prometheus Metrics"
description: "Wait for Prometheus and query metrics"
inputs:
  namespace:
    description: "Namespace of the monitored workload"
    required: false
    default: "echo"

runs:
  using: "composite"
  steps:
    - name: Wait for Prometheus pod
      shell: bash
      run: |
        echo "🔍 Waiting for Prometheus pod to become ready..."

        # Find Prometheus pod name
        POD=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus \
              -o jsonpath='{.items[0].metadata.name}' || true)

        if [ -z "$POD" ]; then
          echo "⚠️ No Prometheus pod found. Listing pods:"
          kubectl get pods -n monitoring
          exit 1
        fi

        echo "Found Prometheus pod: $POD"
        kubectl wait --for=condition=ready pod/$POD -n monitoring --timeout=300s || {
          echo "Prometheus pod not ready after 5 minutes"
          kubectl get pods -n monitoring
          kubectl describe pod $POD -n monitoring
          exit 1
        }

        echo "Prometheus pod is ready"

    - name: Port-forward and collect metrics
      shell: bash
      run: |
        echo "Starting port-forward..."
        POD=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus \
              -o jsonpath='{.items[0].metadata.name}')
        kubectl port-forward -n monitoring $POD 9090:9090 &
        sleep 10

        echo "📊 Querying Prometheus..."
        CPU=$(curl -s "http://localhost:9090/api/v1/query?query=sum(rate(container_cpu_usage_seconds_total{namespace='${{ inputs.namespace }}'}[1m]))" | jq -r '.data.result[0].value[1]')
        MEM=$(curl -s "http://localhost:9090/api/v1/query?query=sum(container_memory_usage_bytes{namespace='${{ inputs.namespace }}'})" | jq -r '.data.result[0].value[1]')

        if [[ -z "$CPU" || "$CPU" == "null" ]]; then
          echo "⚠️ Failed to query Prometheus metrics"
          kubectl logs -n monitoring $POD --tail=50
          exit 0
        fi

        CPU_MILLICORES=$(echo "$CPU * 1000" | bc)
        MEM_MB=$(echo "$MEM / 1024 / 1024" | bc)

        echo "Prometheus metrics: CPU=${CPU_MILLICORES}m, MEM=${MEM_MB}MB"
        echo "CPU=${CPU_MILLICORES}" >> $GITHUB_ENV
        echo "MEM=${MEM_MB}" >> $GITHUB_ENV
