name: "Collect Prometheus Metrics"
description: "Fetch CPU and memory utilization for default namespace"
runs:
  using: "composite"
  steps:
    - name: Query Prometheus for metrics
      shell: bash
      run: |
        echo " Collecting Prometheus metrics..."
        POD=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus -o jsonpath='{.items[0].metadata.name}')
        kubectl port-forward -n monitoring $POD 9090:9090 &
        sleep 10

        
        CPU=$(curl -s "http://localhost:9090/api/v1/query?query=sum(rate(container_cpu_usage_seconds_total{namespace='echo'}[1m]))" | jq -r '.data.result[0].value[1]')
        MEM=$(curl -s "http://localhost:9090/api/v1/query?query=sum(container_memory_usage_bytes{namespace='echo'})" | jq -r '.data.result[0].value[1]')

        CPU_MILLICORES=$(echo "$CPU * 1000" | bc)
        MEM_MB=$(echo "$MEM / 1024 / 1024" | bc)

        echo "CPU=${CPU_MILLICORES}" >> $GITHUB_ENV
        echo "MEM=${MEM_MB}" >> $GITHUB_ENV
        echo "Prometheus metrics: CPU=${CPU_MILLICORES} millicores, MEM=${MEM_MB} MB"
